client_id = "f31e7966282d20ec0ab9e3a570b41965"
name = "Wishlist Eglobe"
handle = "wishlist-eglobe"
application_url = "https://odd-sport-handled-cleanup.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://odd-sport-handled-cleanup.trycloudflare.com/auth/callback",
  "https://odd-sport-handled-cleanup.trycloudflare.com/auth/shopify/callback",
  "https://odd-sport-handled-cleanup.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
